<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Sky Drone AR Viewer</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: system-ui; }
    #camera-feed {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1;
    }
    #ar-canvas {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 2; pointer-events: none;
    }
    #ui-overlay {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    button {
      padding: 10px 20px; background: #1b3864; border: 1px solid #70e6ff;
      color: #fff; font-weight: bold; border-radius: 8px;
    }
  </style>
</head>
<body>
  <video id="camera-feed" autoplay playsinline muted></video>
  <canvas id="ar-canvas"></canvas>

  <div id="ui-overlay">
    <button id="btn-start">Start Sky AR</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";

    const canvas = document.getElementById("ar-canvas");
    const video = document.getElementById("camera-feed");
    const btnStart = document.getElementById("btn-start");

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Sample formation floating 40m up, 50m north
    const group = new THREE.Group();
    group.position.set(0, 40, -50);
    scene.add(group);

    const geom = new THREE.BufferGeometry();
    const pos = [];
    for(let i = 0; i < 300; i++) {
      const a = (i / 300) * Math.PI * 2;
      pos.push(Math.cos(a) * 15, Math.sin(a) * 15, (Math.random() - 0.5) * 4);
    }
    geom.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ color: 0x70e6ff, size: 1.5 });
    group.add(new THREE.Points(geom, mat));

    // Start Camera & Sensor Handlers
    btnStart.onclick = async () => {
      btnStart.style.display = "none";

      // 1. Rear Camera Stream
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" }
      });
      video.srcObject = stream;

      // 2. iOS Device Orientation Permission
      if (typeof DeviceOrientationEvent.requestPermission === "function") {
        await DeviceOrientationEvent.requestPermission();
      }

      // 3. Sensor Fusion Orientation
      window.addEventListener("deviceorientation", (e) => {
        const alpha = THREE.MathUtils.degToRad(e.alpha || 0); // Compass
        const beta  = THREE.MathUtils.degToRad(e.beta || 0);  // Tilt front/back
        const gamma = THREE.MathUtils.degToRad(e.gamma || 0); // Tilt left/right

        camera.rotation.set(beta - Math.PI / 2, alpha, -gamma, "YXZ");
      });
    };

    renderer.setAnimationLoop(() => {
      group.rotation.y += 0.01;
      renderer.render(scene, camera);
    });

    window.onresize = () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    };
  </script>
</body>
</html>
