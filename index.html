<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WebXR Hand Tracking Test</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
    #info {
      position: absolute; top: 20px; width: 100%; text-align: center;
      color: #fff; z-index: 100; pointer-events: none; font-size: 18px;
    }
  </style>

  <!-- Three.js ESM Imports -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="info">WebXR Hand Tracking Test — Open in Meta Quest Browser</div>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

    // 1. Scene & Camera Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a16);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
    camera.position.set(0, 1.2, 0.3);

    // 2. WebGL Renderer with WebXR Enabled
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Request WebXR VR session with hand-tracking feature flag
    document.body.appendChild(VRButton.createButton(renderer, {
      optionalFeatures: ['hand-tracking', 'local-floor']
    }));

    // 3. Lighting
    const light = new THREE.HemisphereLight(0xffffff, 0x333344, 2);
    light.position.set(0, 1, 0);
    scene.add(light);

    // 4. Floating Node (Memory Node placed 40cm in front of user chest)
    const geometry = new THREE.SphereGeometry(0.05, 32, 32);
    const material = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.3, metalness: 0.2 });
    const node = new THREE.Mesh(geometry, material);
    node.position.set(0, 1.2, -0.4);
    scene.add(node);

    // 5. Hand Setup using Official Three.js XRHandModelFactory
    const handModelFactory = new XRHandModelFactory();
    const hands = [];

    for (let i = 0; i < 2; i++) {
      const hand = renderer.xr.getHand(i);
      const handModel = handModelFactory.createHandModel(hand, 'mesh');
      hand.add(handModel);
      scene.add(hand);
      hands.push(hand);
    }

    // Vectors for matrix distance math
    const fingerPos = new THREE.Vector3();
    const thumbPos = new THREE.Vector3();

    // 6. Main Interaction Loop
    renderer.setAnimationLoop(() => {
      let isInteracting = false;

      hands.forEach((hand) => {
        if (!hand.joints) return;

        const indexTip = hand.joints['index-finger-tip'];
        const thumbTip = hand.joints['thumb-tip'];

        if (indexTip && indexTip.visible) {
          fingerPos.setFromMatrixPosition(indexTip.matrixWorld);
          const distanceToNode = fingerPos.distanceTo(node.position);

          // Interaction 1: Near-Field Poke (Fingertip enters node collision sphere)
          if (distanceToNode < 0.07) {
            isInteracting = true;
          }

          // Interaction 2: Proximity Pinch & Drag
          if (thumbTip && thumbTip.visible) {
            thumbPos.setFromMatrixPosition(thumbTip.matrixWorld);
            const pinchDistance = fingerPos.distanceTo(thumbPos);

            // Pinch triggered (< 2cm between tips) while within 12cm of node
            if (pinchDistance < 0.025 && distanceToNode < 0.12) {
              const pinchCenter = new THREE.Vector3().addVectors(fingerPos, thumbPos).multiplyScalar(0.5);
              node.position.copy(pinchCenter); // Drag node with pinch
              isInteracting = true;
            }
          }
        }
      });

      // Visual State Updates
      if (isInteracting) {
        node.material.color.setHex(0x10b981); // Emerald green on touch/pinch
        node.scale.setScalar(1.25);
      } else {
        node.material.color.setHex(0x3b82f6); // Default blue
        node.scale.setScalar(1.0);
        node.rotation.y += 0.01; // Idle rotation
      }

      renderer.render(scene, camera);
    });

    // Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
