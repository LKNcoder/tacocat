<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>WebXR Hand Tracking — A-Frame Boilerplate</title>
    <!-- Standard A-Frame Framework (Includes Three.js & WebXR polyfills) -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene webxr="optionalFeatures: hand-tracking;">
      <!-- Environment & Lighting -->
      <a-sky color="#05050d"></a-sky>
      <a-light type="ambient" intensity="0.8"></a-light>
      <a-light type="directional" position="1 2 1" intensity="1.2"></a-light>

      <!-- 3D Interactive Node (Memory Star) -->
      <a-sphere 
        id="memoryNode" 
        position="0 1.2 -0.5" 
        radius="0.08" 
        color="#3b82f6"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
      </a-sphere>

      <!-- Meta Standard Ghost Hands (Handles GLTF loading, joints, and gestures) -->
      <a-entity 
        id="leftHand" 
        hand-tracking-controls="hand: left; handModelStyle: lowPoly; color: #60a5fa;">
      </a-entity>
      
      <a-entity 
        id="rightHand" 
        hand-tracking-controls="hand: right; handModelStyle: lowPoly; color: #60a5fa;">
      </a-entity>

      <a-camera position="0 1.6 0"></a-camera>
    </a-scene>

    <script>
      const node = document.querySelector('#memoryNode');

      // Bind directly to built-in framework gesture events
      ['leftHand', 'rightHand'].forEach(handId => {
        const hand = document.querySelector(`#${handId}`);
        
        // Native Pinch Event (Pinch Index + Thumb)
        hand.addEventListener('pinchstarted', (evt) => {
          node.setAttribute('color', '#34d399'); // Turn green on pinch
          node.setAttribute('scale', '1.25 1.25 1.25');
        });

        hand.addEventListener('pinchend', (evt) => {
          node.setAttribute('color', '#3b82f6'); // Return to blue
          node.setAttribute('scale', '1 1 1');
        });
      });
    </script>
  </body>
</html>
