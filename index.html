<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VVIZ Drone Show Viewer</title>
<style>
:root {
  color-scheme: dark;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  overflow: hidden;
  background: #02040d;
  color: #e8efff;
  font: 14px/1.4 system-ui, sans-serif;
}
canvas {
  display: block;
}
#panel {
  position: fixed;
  z-index: 2;
  left: 16px;
  top: 16px;
  width: min(440px, calc(100vw - 32px));
  padding: 14px;
  border: 1px solid #ffffff26;
  border-radius: 14px;
  background: #07101ddd;
  backdrop-filter: blur(12px);
  box-shadow: 0 12px 40px #0008;
}
#title {
  font-weight: 700;
  font-size: 16px;
  margin-bottom: 3px;
}
#status {
  color: #aebdda;
  font-size: 12px;
  margin-bottom: 10px;
}
.row {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
button,
label.file,
select {
  color: #ecf3ff;
  background: #172742;
  border: 1px solid #375077;
  border-radius: 8px;
  padding: 8px 10px;
  cursor: pointer;
  font: inherit;
}
button:hover,
label.file:hover,
select:hover {
  background: #22385c;
}
input[type="range"] {
  width: 100%;
  accent-color: #70e6ff;
}
#clock {
  min-width: 100px;
  color: #b9c8e3;
  font-variant-numeric: tabular-nums;
}
#hint {
  color: #8fa2c3;
  font-size: 11px;
  margin-top: 9px;
}
#file {
  display: none;
}
#vr-tip {
  position: fixed;
  z-index: 1;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  color: #b9c8e3;
  background: #07101dbb;
  padding: 7px 11px;
  border-radius: 8px;
  font-size: 12px;
  white-space: nowrap;
  pointer-events: none;
}
body.xr-active #panel,
body.xr-active #vr-tip,
body.xr-active #VRButton {
  display: none !important;
}
@media (max-width: 520px) {
  #panel {
    top: 8px;
    left: 8px;
    width: calc(100vw - 16px);
  }
  #vr-tip {
    max-width: calc(100vw - 20px);
    white-space: normal;
    text-align: center;
  }
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="panel">
  <div id="title">VVIZ Drone Show Viewer</div>
  <div id="status">Building the 400-drone demo...</div>
  <div class="row">
    <button id="play">Pause</button>
    <span id="clock">00:00 / 06:00</span>
    <select id="speed" aria-label="Playback speed">
      <option value="0.5">0.5x</option>
      <option value="1" selected>1x</option>
      <option value="2">2x</option>
      <option value="4">4x</option>
    </select>
  </div>
  <input id="seek" type="range" min="0" max="360" step="0.1" value="0">
  <div class="row">
    <label class="file" for="file">Load VVIZ/JSON</label>
    <input id="file" type="file" accept=".vviz,.json,application/json">
    <button id="download">Download demo VVIZ</button>
  </div>
  <div id="hint">
    Mouse drag: orbit · Wheel: zoom · VR button: enter headset
  </div>
</div>
<div id="vr-tip">
  In VR, press the left-controller X button to open the control panel.
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { VRButton } from "three/addons/webxr/VRButton.js";

const $ = id => document.getElementById(id);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02040d);

const camera = new THREE.PerspectiveCamera(
  55,
  innerWidth / innerHeight,
  0.1,
  500
);
camera.position.set(0, 18, 66);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

/*
 * XR player rig
 */
const xrRig = new THREE.Group();
scene.add(xrRig);
xrRig.add(camera);

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 14, 0);
orbit.update();

/*
 * VR controller input
 */
const leftController = renderer.xr.getController(0);
const rightController = renderer.xr.getController(1);

// Attach controllers to xrRig so they move when locomotion translates the rig
xrRig.add(leftController);
xrRig.add(rightController);

const vrInput = {
  left: null,
  right: null
};

leftController.addEventListener("connected", event => {
  vrInput.left = event.data;
});
leftController.addEventListener("disconnected", () => {
  vrInput.left = null;
});
rightController.addEventListener("connected", event => {
  vrInput.right = event.data;
});
rightController.addEventListener("disconnected", () => {
  vrInput.right = null;
});

const controllerRays = [];
function addControllerRay(controller) {
  const rayGeometry = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(0, 0, -1)
  ]);
  const rayMaterial = new THREE.LineBasicMaterial({
    color: 0x70e6ff,
    transparent: true,
    opacity: 0.65
  });
  const ray = new THREE.Line(rayGeometry, rayMaterial);
  ray.name = "VR Controller Ray";
  ray.scale.z = 3;
  ray.visible = false; // Hidden until menu opens
  controller.add(ray);
  controllerRays.push(ray);
}

addControllerRay(leftController);
addControllerRay(rightController);

function updateRayVisibility() {
  const showRays = renderer.xr.isPresenting && vrPanel.visible;
  for (const ray of controllerRays) {
    ray.visible = showRays;
  }
}

function getStick(source) {
  if (!source || !source.gamepad) {
    return { x: 0, y: 0 };
  }
  const axes = source.gamepad.axes || [];
  const offset = axes.length >= 4 ? 2 : 0;
  let x = axes[offset] || 0;
  let y = axes[offset + 1] || 0;
  const deadZone = 0.15;
  if (Math.abs(x) < deadZone) x = 0;
  if (Math.abs(y) < deadZone) y = 0;
  return { x, y };
}

let snapTurnCooldown = 0;
function updateVRLocomotion(dt) {
  if (!renderer.xr.isPresenting) {
    return;
  }
  const leftStick = getStick(vrInput.left);
  const rightStick = getStick(vrInput.right);

  const forward = new THREE.Vector3();
  camera.getWorldDirection(forward);
  forward.y = 0;
  if (forward.lengthSq() < 0.0001) {
    return;
  }
  forward.normalize();

  const right = new THREE.Vector3()
    .crossVectors(forward, new THREE.Vector3(0, 1, 0))
    .normalize();

  const movement = new THREE.Vector3()
    .addScaledVector(forward, -leftStick.y)
    .addScaledVector(right, leftStick.x);

  if (movement.lengthSq() > 0) {
    movement.normalize();
    const moveSpeed = 5;
    xrRig.position.addScaledVector(movement, moveSpeed * dt);
  }

  snapTurnCooldown -= dt;
  if (Math.abs(rightStick.x) > 0.65 && snapTurnCooldown <= 0) {
    const turnAmount =
      rightStick.x > 0
        ? -THREE.MathUtils.degToRad(30)
        : THREE.MathUtils.degToRad(30);
    xrRig.rotation.y += turnAmount;
    snapTurnCooldown = 0.3;
  }
}

/*
 * Environment
 */
scene.add(new THREE.HemisphereLight(0x9bbcff, 0x101629, 1.1));
const grid = new THREE.GridHelper(90, 45, 0x274064, 0x14223b);
grid.position.y = 0;
scene.add(grid);

/*
 * Star field
 */
{
  const points = [];
  let seed = 7491;
  const random = () => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };
  for (let i = 0; i < 700; i++) {
    points.push(
      (random() - 0.5) * 150,
      random() * 75 + 3,
      -35 - random() * 90
    );
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(points, 3)
  );
  scene.add(
    new THREE.Points(
      geometry,
      new THREE.PointsMaterial({
        color: 0x849ac7,
        size: 0.18,
        transparent: true,
        opacity: 0.55
      })
    )
  );
}

/*
 * Drone glow texture
 */
const glowCanvas = document.createElement("canvas");
glowCanvas.width = 64;
glowCanvas.height = 64;
const glowContext = glowCanvas.getContext("2d");
const gradient = glowContext.createRadialGradient(32, 32, 1, 32, 32, 32);
gradient.addColorStop(0, "rgba(255,255,255,1)");
gradient.addColorStop(0.18, "rgba(255,255,255,.9)");
gradient.addColorStop(0.5, "rgba(255,255,255,.25)");
gradient.addColorStop(1, "rgba(255,255,255,0)");
glowContext.fillStyle = gradient;
glowContext.fillRect(0, 0, 64, 64);

const glow = new THREE.CanvasTexture(glowCanvas);
glow.colorSpace = THREE.SRGBColorSpace;
glow.needsUpdate = true;

/*
 * Drone point cloud
 */
const droneGeometry = new THREE.BufferGeometry();
const positions = new Float32Array(400 * 3);
const colors = new Float32Array(400 * 3);

droneGeometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
droneGeometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

const dronePoints = new THREE.Points(
  droneGeometry,
  new THREE.PointsMaterial({
    size: 0.525,
    map: glow,
    vertexColors: true,
    transparent: true,
    alphaTest: 0.08,
    blending: THREE.AdditiveBlending,
    depthTest: true,
    depthWrite: false,
    sizeAttenuation: true
  })
);
scene.add(dronePoints);

const PALETTES = [
  [0x24d9ff, 0x76f4ff, 0x4a8dff],
  [0xff6b35, 0xffc857, 0x8cecff],
  [0xff6ad5, 0xb56cff, 0x58d9ff],
  [0xff3158, 0xff8b9b, 0xffdce3],
  [0x56d9ff, 0x8b79ff, 0xffd166],
  [0x3bf0d0, 0x4ca8ff, 0xc5fff5],
  [0xff68c5, 0xffd166, 0x74f2dd],
  [0x75e6ff, 0x438dff, 0xd7f8ff],
  [0x9b70ff, 0x44d9ff, 0xff6bc9],
  [0x39e58c, 0xa6ff70, 0xffd166],
  [0xffdb64, 0xff7d4d, 0x76dcff],
  [0xfff2a1, 0x6cecff, 0xff66d9]
];

const TITLES = [
  "Celestial Rings",
  "Comet Across the Sky",
  "The Butterfly",
  "A Beating Heart",
  "Saturn's Garden",
  "Ocean of Light",
  "Bloom",
  "The Sky Whale",
  "Spiral Galaxy",
  "The Luminous Tree",
  "Supernova",
  "Cosmic Garden Finale"
];

const SHOW_SECONDS = 360;
const SCENE_SECONDS = 30;
const SAMPLE_SECONDS = 5;

const GOLDEN = Math.PI * (3 - Math.sqrt(5));
const fract = value => value - Math.floor(value);
const hash = value =>
  fract(Math.sin(value * 127.1 + 311.7) * 43758.5453);

function shape(sceneIndex, index, count) {
  const u = (index + 0.5) / count;
  const angle = index * GOLDEN;
  const random = hash(index + sceneIndex * 701);
  let x = 0;
  let y = 14;
  let z = (hash(index * 19 + sceneIndex * 313) - 0.5) * 2.8;

  if (sceneIndex === 0) {
    const band = index % 4;
    const radius = [5, 9, 13, 17][band] + (random - 0.5) * 0.5;
    x = radius * Math.cos(angle);
    y += radius * Math.sin(angle);
  } else if (sceneIndex === 1) {
    x = -23 + 45 * u;
    y += (random - 0.5) * (1 - u) * 13 + 2 * Math.sin(u * 5);
  } else if (sceneIndex === 2) {
    const t = u * Math.PI * 12;
    const q =
      Math.exp(Math.cos(t)) -
      2 * Math.cos(4 * t) -
      Math.pow(Math.sin(t / 12), 5);
    x = 4.3 * Math.sin(t) * q;
    y += 4.3 * Math.cos(t) * q;
  } else if (sceneIndex === 3 || (sceneIndex === 11 && u < 0.78)) {
    const t = angle;
    const radius = Math.sqrt(u) * 0.88;
    x = 0.85 * radius * 16 * Math.pow(Math.sin(t), 3);
    y += 0.72 * radius * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
  } else if (sceneIndex === 4) {
    if (u < 0.25) {
      const radius = 6 * Math.sqrt(u / 0.25);
      x = radius * Math.cos(angle);
      y += radius * Math.sin(angle);
    } else {
      const radius = 8 + 10 * hash(index * 3);
      x = radius * Math.cos(angle);
      y += radius * 0.36 * Math.sin(angle);
    }
  } else if (sceneIndex === 5) {
    x = -23 + 46 * u;
    y += 7 * Math.sin(x * 0.22) + 3.4 * Math.sin(x * 0.48 + 1.1) + (random - 0.5) * 1.7;
  } else if (sceneIndex === 6) {
    const radius = Math.sqrt(u) * (10 + 5 * Math.cos(6 * angle));
    x = radius * Math.cos(angle);
    y += radius * Math.sin(angle);
  } else if (sceneIndex === 7) {
    if (u < 0.78) {
      const radius = Math.sqrt(u / 0.78);
      x = 2 + 15 * radius * Math.cos(angle);
      y += 6.4 * radius * Math.sin(angle);
    } else {
      const q = (u - 0.78) / 0.22;
      x = -13 - q * 7;
      y += (q < 0.5 ? q * 18 : (1 - q) * 18) - 4;
    }
  } else if (sceneIndex === 8) {
    const arm = index % 3;
    const radius = 1.2 + 20 * u;
    const t = angle * 0.5 + (arm * Math.PI * 2) / 3;
    x = radius * Math.cos(t) + (random - 0.5) * 1.2;
    y += radius * Math.sin(t) * 0.66 + (random - 0.5) * 1.2;
  } else if (sceneIndex === 9) {
    if (u < 0.86) {
      const q = u / 0.86;
      y += -9 + 23 * Math.sqrt(q);
      const halfWidth = Math.max(0.5, (1 - q) * 12);
      x = (random * 2 - 1) * halfWidth;
    } else {
      x = (random - 0.5) * 4;
      y += -12 + hash(index * 7) * 8;
    }
  } else if (sceneIndex === 10) {
    const ray = index % 12;
    const t = (ray * Math.PI) / 6;
    const radius = 2 + 21 * u;
    x = radius * Math.cos(t) + (random - 0.5) * 0.65;
    y += radius * Math.sin(t) + (hash(index * 9) - 0.5) * 0.65;
  } else {
    const radius = 19 + (hash(index * 5) - 0.5) * 1.4;
    x = radius * Math.cos(angle);
    y += radius * 0.58 * Math.sin(angle);
  }
  return [x, y, z];
}

function demoPosition(seconds, index, count) {
  const progress = Math.min(11, seconds / SCENE_SECONDS);
  const sceneIndex = Math.floor(progress);
  const blend = progress - sceneIndex;
  const eased = blend * blend * (3 - 2 * blend);
  const first = shape(sceneIndex, index, count);
  if (sceneIndex < 11) {
    const second = shape(sceneIndex + 1, index, count);
    return first.map(
      (value, component) =>
        value + (second[component] - value) * eased
    );
  }
  return first;
}

function makeDemo() {
  const performances = [];
  for (let i = 0; i < 400; i++) {
    const home = demoPosition(0, i, 400);
    const traversal = [];
    let previous = home;
    for (
      let seconds = SAMPLE_SECONDS;
      seconds <= SHOW_SECONDS;
      seconds += SAMPLE_SECONDS
    ) {
      const position = demoPosition(seconds, i, 400);
      traversal.push({
        dt: SAMPLE_SECONDS,
        dx: position[0] - previous[0],
        dy: position[1] - previous[1],
        dz: position[2] - previous[2],
        dh: 0
      });
      previous = position;
    }
    const payloadActions = PALETTES.map(palette => {
      const color = new THREE.Color(palette[i % palette.length]);
      return {
        r: Math.round(color.r * 255),
        g: Math.round(color.g * 255),
        b: Math.round(color.b * 255),
        frames: SCENE_SECONDS
      };
    });
    performances.push({
      id: i,
      agentDescription: {
        homeX: home[0],
        homeY: home[1],
        homeZ: home[2],
        homeH: 0,
        airframe: "VisualizationOnly",
        agentTraversal: traversal
      },
      payloadDescription: [
        {
          id: 0,
          type: "Light",
          colorType: "RGB",
          sourceType: "Dome",
          payloadActions
        }
      ]
    });
  }
  return {
    version: "1.0",
    performanceName: "Cosmic Garden — 400 drones, 6 minutes",
    coordinateFrame: "ogl",
    defaultPositionRate: 1,
    defaultColorRate: 1,
    timeOffsetSecs: 0,
    eventTags: TITLES.map((name, index) => ({
      time: index * SCENE_SECONDS,
      tagType: "Scene",
      tagID: name
    })),
    performances
  };
}

function readAgent(performance, offset, positionRate, colorRate) {
  const agent = performance.agentDescription || {};
  let x = Number(agent.homeX) || 0;
  let y = Number(agent.homeY) || 0;
  let z = Number(agent.homeZ) || 0;
  const path = [{ t: offset, p: [x, y, z] }];
  let time = offset;
  for (const step of agent.agentTraversal || []) {
    time += Number(step.dt) || 1 / positionRate;
    x += Number(step.dx) || 0;
    y += Number(step.dy) || 0;
    z += Number(step.dz) || 0;
    path.push({ t: time, p: [x, y, z] });
  }
  const colorTimeline = [];
  for (const payload of performance.payloadDescription || []) {
    if (payload.type !== "Light") {
      continue;
    }
    let colorTime = offset;
    for (const action of payload.payloadActions || []) {
      if (
        action.r !== undefined ||
        action.g !== undefined ||
        action.b !== undefined
      ) {
        colorTimeline.push({
          t: colorTime,
          c: [action.r || 0, action.g || 0, action.b || 0]
        });
      }
      colorTime += (Number(action.frames) || 1) / colorRate;
    }
    if (colorTimeline.length) {
      break;
    }
  }
  return {
    path,
    colors: colorTimeline.length
      ? colorTimeline
      : [{ t: offset, c: [220, 235, 255] }]
  };
}

function atPath(path, time) {
  if (time <= path[0].t) {
    return path[0].p;
  }
  let low = 0;
  let high = path.length - 1;
  while (low + 1 < high) {
    const middle = (low + high) >> 1;
    if (path[middle].t <= time) {
      low = middle;
    } else {
      high = middle;
    }
  }
  const first = path[low];
  const second = path[high];
  const amount =
    second.t === first.t
      ? 0
      : (time - first.t) / (second.t - first.t);
  return first.p.map(
    (value, component) =>
      value + (second.p[component] - value) * amount
  );
}

function atColor(colors, time) {
  let color = colors[0].c;
  for (let i = 1; i < colors.length && colors[i].t <= time; i++) {
    color = colors[i].c;
  }
  return color;
}

function srgbToLinear(value) {
  value = Math.max(0, Math.min(1, value / 255));
  return value <= 0.04045
    ? value / 12.92
    : Math.pow((value + 0.055) / 1.055, 2.4);
}

let agents = [];
let showStart = 0;
let showEnd = 360;
let time = 0;
let playing = true;
let activeShow = null;

const seek = $("seek");

/*
 * VR control panel
 */
const vrPanel = new THREE.Group();
vrPanel.visible = false;
xrRig.add(vrPanel);

const vrPanelCanvas = document.createElement("canvas");
vrPanelCanvas.width = 900;
vrPanelCanvas.height = 540;
const vrPanelContext = vrPanelCanvas.getContext("2d");

const vrPanelTexture = new THREE.CanvasTexture(vrPanelCanvas);
vrPanelTexture.colorSpace = THREE.SRGBColorSpace;

const vrPanelMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(2.8, 1.68),
  new THREE.MeshBasicMaterial({
    map: vrPanelTexture,
    transparent: true,
    side: THREE.DoubleSide,
    depthTest: true
  })
);
vrPanel.add(vrPanelMesh);

/*
 * Invisible clickable zones placed slightly in front of panel.
 * depthWrite: false prevents depth masking that causes buttons to go transparent.
 */
const vrTargets = [];
function addVRTarget(action, x, y, width, height) {
  const target = new THREE.Mesh(
    new THREE.PlaneGeometry(width, height),
    new THREE.MeshBasicMaterial({
      transparent: true,
      opacity: 0,
      depthWrite: false,
      side: THREE.DoubleSide
    })
  );
  target.position.set(x, y, 0.025);
  target.userData.action = action;
  vrPanel.add(target);
  vrTargets.push(target);
  return target;
}

addVRTarget("play", -0.92, -0.28, 0.55, 0.28);
addVRTarget("slower", -0.28, -0.28, 0.38, 0.28);
addVRTarget("faster", 0.18, -0.28, 0.38, 0.28);
addVRTarget("exit", 0.98, -0.28, 0.55, 0.28);
addVRTarget("scrub", 0, 0.22, 2.25, 0.2);

function updateVRPanel() {
  const context = vrPanelContext;
  const width = vrPanelCanvas.width;
  const height = vrPanelCanvas.height;

  context.clearRect(0, 0, width, height);

  context.fillStyle = "rgba(5, 12, 28, 0.94)";
  context.fillRect(0, 0, width, height);

  context.strokeStyle = "rgba(120, 220, 255, 0.85)";
  context.lineWidth = 5;
  context.strokeRect(8, 8, width - 16, height - 16);

  context.fillStyle = "#e8efff";
  context.font = "bold 34px system-ui, sans-serif";
  context.fillText("DRONE SHOW", 48, 58);

  context.fillStyle = "#9fb5d8";
  context.font = "22px system-ui, sans-serif";
  context.fillText(
    activeShow?.performanceName || "Cosmic Garden",
    48,
    92
  );

  context.fillStyle = "#dceaff";
  context.font = "bold 26px system-ui, sans-serif";
  context.fillText(
    formatTime(time - showStart) + " / " + formatTime(showEnd - showStart),
    48,
    148
  );

  /*
   * Progress bar
   */
  const progress =
    showEnd > showStart
      ? (time - showStart) / (showEnd - showStart)
      : 0;

  const barX = 112;
  const barY = 232;
  const barWidth = 676;
  const barHeight = 24;

  context.fillStyle = "rgba(255,255,255,0.18)";
  context.fillRect(barX, barY, barWidth, barHeight);

  context.fillStyle = "#70e6ff";
  context.fillRect(
    barX,
    barY,
    barWidth * Math.max(0, Math.min(1, progress)),
    barHeight
  );

  context.fillStyle = "#b8c9e8";
  context.font = "18px system-ui, sans-serif";
  context.fillText("Drag or point at the timeline", 112, 286);

  function drawButton(x, y, buttonWidth, label, active = false) {
    context.fillStyle = active
      ? "rgba(75, 180, 230, 0.65)"
      : "rgba(40, 67, 105, 0.95)";
    context.fillRect(x, y, buttonWidth, 72);

    context.strokeStyle = "rgba(130, 210, 255, 0.75)";
    context.lineWidth = 3;
    context.strokeRect(x, y, buttonWidth, 72);

    context.fillStyle = "#f1f7ff";
    context.font = "bold 22px system-ui, sans-serif";
    context.textAlign = "center";
    context.fillText(label, x + buttonWidth / 2, y + 45);
    context.textAlign = "left";
  }

  drawButton(48, 350, 176, playing ? "PAUSE" : "PLAY", playing);
  drawButton(286, 350, 122, "SLOWER");
  drawButton(444, 350, 122, "FASTER");
  drawButton(676, 350, 176, "EXIT VR");

  context.fillStyle = "#92a8ca";
  context.font = "18px system-ui, sans-serif";
  context.fillText("Left controller X: show/hide panel", 48, 472);

  vrPanelTexture.needsUpdate = true;
}

function showVRPanelInFrontOfUser() {
  const headPosition = new THREE.Vector3();
  headPosition.setFromMatrixPosition(camera.matrixWorld);

  const direction = new THREE.Vector3();
  camera.getWorldDirection(direction);
  direction.y = 0;
  if (direction.lengthSq() < 0.001) {
    direction.set(0, 0, -1);
  }
  direction.normalize();

  const panelWorldPosition = headPosition.clone().add(
    direction.multiplyScalar(2.25)
  );
  panelWorldPosition.y = headPosition.y - 0.05;

  xrRig.worldToLocal(panelWorldPosition);
  vrPanel.position.copy(panelWorldPosition);

  /*
   * Make the panel face the user horizontally
   */
  const worldYaw = Math.atan2(-direction.x, -direction.z);
  vrPanel.rotation.set(0, worldYaw - xrRig.rotation.y, 0);
}

function toggleVRPanel() {
  if (!renderer.xr.isPresenting) {
    return;
  }
  vrPanel.visible = !vrPanel.visible;
  if (vrPanel.visible) {
    showVRPanelInFrontOfUser();
    updateVRPanel();
  }
  updateRayVisibility();
}

function activateVRAction(action, intersection) {
  if (action === "play") {
    playing = !playing;
    $("play").textContent = playing ? "Pause" : "Play";
  } else if (action === "slower") {
    const current = Number($("speed").value);
    $("speed").value = String(Math.max(0.5, current / 2));
  } else if (action === "faster") {
    const current = Number($("speed").value);
    $("speed").value = String(Math.min(4, current * 2));
  } else if (action === "exit") {
    const session = renderer.xr.getSession();
    if (session) {
      session.end();
    }
  } else if (action === "scrub" && intersection) {
    const localPoint = vrPanel.worldToLocal(intersection.point.clone());
    const scrubAmount = (localPoint.x + 1.125) / 2.25;
    time =
      showStart +
      Math.max(0, Math.min(1, scrubAmount)) * (showEnd - showStart);
    drawAt(time);
  }
  updateVRPanel();
}

const vrRaycaster = new THREE.Raycaster();
const controllerQuaternion = new THREE.Quaternion();

function handleControllerSelect(controller) {
  if (!renderer.xr.isPresenting || !vrPanel.visible) {
    return;
  }
  const origin = new THREE.Vector3().setFromMatrixPosition(
    controller.matrixWorld
  );
  controller.getWorldQuaternion(controllerQuaternion);
  const direction = new THREE.Vector3(0, 0, -1)
    .applyQuaternion(controllerQuaternion)
    .normalize();

  vrRaycaster.set(origin, direction);

  const intersections = vrRaycaster.intersectObjects(vrTargets, false);
  if (!intersections.length) {
    return;
  }

  const intersection = intersections[0];
  activateVRAction(intersection.object.userData.action, intersection);
}

leftController.addEventListener("selectend", () => {
  handleControllerSelect(leftController);
});
rightController.addEventListener("selectend", () => {
  handleControllerSelect(rightController);
});

let xButtonWasPressed = false;
function updateVRPanelButton() {
  if (!renderer.xr.isPresenting) {
    xButtonWasPressed = false;
    return;
  }
  const gamepad = vrInput.left?.gamepad;
  /*
   * Left X button is button index 4 on standard Oculus Touch mappings
   */
  const xButton = gamepad?.buttons?.[4];
  const pressed = Boolean(xButton?.pressed);

  if (pressed && !xButtonWasPressed) {
    toggleVRPanel();
  }
  xButtonWasPressed = pressed;
}

function loadShow(data, label) {
  if (!data || !Array.isArray(data.performances)) {
    throw new Error("That file doesn't contain a VVIZ performances array.");
  }
  const offset = Number(data.timeOffsetSecs) || 0;
  const positionRate = Number(data.defaultPositionRate) || 1;
  const colorRate = Number(data.defaultColorRate) || 1;

  agents = data.performances.map(performance =>
    readAgent(performance, offset, positionRate, colorRate)
  );

  if (!agents.length) {
    throw new Error("No drone performances found in that VVIZ file.");
  }

  showStart = Math.min(...agents.map(agent => agent.path[0].t));
  showEnd = Math.max(...agents.map(agent => agent.path.at(-1).t));

  if (!(showEnd > showStart)) {
    showEnd = showStart + 1;
  }
  time = showStart;
  playing = true;
  activeShow = data;

  seek.min = showStart;
  seek.max = showEnd;
  seek.value = time;

  $("title").textContent =
    data.performanceName || label || "VVIZ Show";
  $("status").textContent = `${agents.length} drones · ${formatTime(
    showEnd - showStart
  )} visualization`;
  $("play").textContent = "Pause";

  drawAt(time);
  updateVRPanel();
}

function drawAt(currentTime) {
  for (let i = 0; i < agents.length; i++) {
    const position = atPath(agents[i].path, currentTime);
    positions[i * 3] = position[0];
    positions[i * 3 + 1] = position[1];
    positions[i * 3 + 2] = position[2];

    const color = atColor(agents[i].colors, currentTime);
    colors[i * 3] = srgbToLinear(color[0]);
    colors[i * 3 + 1] = srgbToLinear(color[1]);
    colors[i * 3 + 2] = srgbToLinear(color[2]);
  }

  droneGeometry.attributes.position.needsUpdate = true;
  droneGeometry.attributes.color.needsUpdate = true;

  seek.value = currentTime;
  $("clock").textContent = `${formatTime(
    currentTime - showStart
  )} / ${formatTime(showEnd - showStart)}`;

  const tags = activeShow?.eventTags || [];
  let currentTag = null;
  for (const event of tags) {
    if (Number(event.time) <= currentTime - showStart) {
      currentTag = event;
    }
  }

  if (currentTag?.tagID) {
    $("hint").textContent = `Now: ${currentTag.tagID} · Mouse drag: orbit · Wheel: zoom`;
  }

  if (vrPanel.visible) {
    updateVRPanel();
  }
}

function formatTime(seconds) {
  seconds = Math.max(0, Math.floor(seconds));
  return `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(
    seconds % 60
  ).padStart(2, "0")}`;
}

$("play").onclick = () => {
  playing = !playing;
  $("play").textContent = playing ? "Pause" : "Play";
  updateVRPanel();
};

$("speed").onchange = () => {
  updateVRPanel();
};

seek.addEventListener("input", () => {
  time = Number(seek.value);
  drawAt(time);
});

$("file").addEventListener("change", async event => {
  const file = event.target.files?.[0];
  if (!file) {
    return;
  }
  try {
    const data = JSON.parse(await file.text());
    loadShow(data, file.name);
  } catch (error) {
    alert(`Couldn't load that file: ${error.message}`);
  }
  event.target.value = "";
});

$("download").onclick = () => {
  const data = makeDemo();
  const blob = new Blob([JSON.stringify(data)], {
    type: "application/json"
  });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "cosmic-garden-400-drones-6min.vviz";
  link.click();
  URL.revokeObjectURL(url);
};

/*
 * VR session state
 */
const desktopPosition = camera.position.clone();
const desktopRotation = camera.rotation.clone();
const desktopRigPosition = xrRig.position.clone();
const desktopRigRotation = xrRig.rotation.clone();

renderer.xr.addEventListener("sessionstart", () => {
  document.body.classList.add("xr-active");
  desktopPosition.copy(camera.position);
  desktopRotation.copy(camera.rotation);
  desktopRigPosition.copy(xrRig.position);
  desktopRigRotation.copy(xrRig.rotation);

  orbit.enabled = false;
  xrRig.position.set(0, 0, 58);
  xrRig.rotation.set(0, 0, 0);
  camera.position.set(0, 0, 0);
  camera.rotation.set(0, 0, 0);

  vrPanel.visible = false;
  xButtonWasPressed = false;
  updateRayVisibility();
});

renderer.xr.addEventListener("sessionend", () => {
  document.body.classList.remove("xr-active");
  vrPanel.visible = false;
  updateRayVisibility();

  xrRig.position.copy(desktopRigPosition);
  xrRig.rotation.copy(desktopRigRotation);
  camera.position.copy(desktopPosition);
  camera.rotation.copy(desktopRotation);

  orbit.enabled = true;
  orbit.target.set(0, 14, 0);
  orbit.update();
});

/*
 * Animation loop
 */
let previous = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now - previous) / 1000);
  previous = now;

  if (playing && agents.length) {
    time += dt * Number($("speed").value);
    if (time >= showEnd) {
      time = showEnd;
      playing = false;
      $("play").textContent = "Play";
    }
  }

  drawAt(time);
  updateVRLocomotion(dt);
  updateVRPanelButton();

  if (!renderer.xr.isPresenting) {
    orbit.update();
  }

  renderer.render(scene, camera);
});

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

try {
  loadShow(makeDemo(), "Cosmic Garden");
} catch (error) {
  $("status").textContent = error.message;
}
</script>
</body>
</html>
