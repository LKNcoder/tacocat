<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebXR Hand Tracking Diagnostic</title>
  <style>
    body { margin: 0; background: #000; overflow: hidden; font-family: monospace; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';

    // 1. Scene & Camera
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a14);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
    camera.position.set(0, 1.4, 0.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 2. Force Required Hand-Tracking Feature
    document.body.appendChild(VRButton.createButton(renderer, {
      requiredFeatures: ['hand-tracking', 'local-floor']
    }));

    // Light
    const light = new THREE.DirectionalLight(0xffffff, 1.5);
    light.position.set(0, 2, 1);
    scene.add(light);

    // 3. In-VR Debug Console
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 256;
    const ctx = canvas.getContext('2d');
    const consoleTexture = new THREE.CanvasTexture(canvas);

    const consolePlane = new THREE.Mesh(
      new THREE.PlaneGeometry(0.8, 0.4),
      new THREE.MeshBasicMaterial({ map: consoleTexture, transparent: true })
    );
    consolePlane.position.set(0, 1.5, -0.7);
    scene.add(consolePlane);

    function log(msg) {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, 512, 256);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 4;
      ctx.strokeRect(4, 4, 504, 248);
      ctx.fillStyle = '#38bdf8';
      ctx.font = '20px monospace';
      ctx.fillText('WEBXR DIAGNOSTIC CONSOLE', 20, 35);
      ctx.fillStyle = '#ffffff';
      ctx.font = '16px monospace';
      
      const lines = msg.split('\n');
      lines.forEach((line, index) => {
        ctx.fillText(line, 20, 75 + (index * 25));
      });
      consoleTexture.needsUpdate = true;
    }

    log('Status: Standby\nClick ENTER VR to begin.');

    // 4. Target Blue Ball
    const target = new THREE.Mesh(
      new THREE.SphereGeometry(0.06, 16, 16),
      new THREE.MeshStandardMaterial({ color: 0x3b82f6 })
    );
    target.position.set(0, 1.2, -0.4);
    scene.add(target);

    // 5. Hand Joint Visualizers (Procedural Boxes)
    const jointGeo = new THREE.BoxGeometry(0.015, 0.015, 0.015);
    const jointMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });

    const handVisualizers = [
      { hand: renderer.xr.getHand(0), boxes: {} },
      { hand: renderer.xr.getHand(1), boxes: {} }
    ];

    handVisualizers.forEach(({ hand, boxes }) => {
      scene.add(hand);
      
      hand.addEventListener('connected', (e) => {
        log(`Hand Connected!\nInput Source: ${e.data.hand ? 'XRHand API Active' : 'Controller'}`);
      });

      hand.addEventListener('disconnected', () => {
        log('Status: Hand Disconnected');
      });
    });

    // 6. Main Loop
    let frameCount = 0;
    renderer.setAnimationLoop(() => {
      frameCount++;
      let activeJointsCount = 0;

      handVisualizers.forEach(({ hand, boxes }, handIdx) => {
        if (hand.joints) {
          // Iterate over joint keys in XRHand
          Object.keys(hand.joints).forEach((jointName) => {
            const joint = hand.joints[jointName];

            if (joint && joint.visible) {
              activeJointsCount++;

              // Create box on-the-fly if not built yet
              if (!boxes[jointName]) {
                const box = new THREE.Mesh(jointGeo, jointMat);
                scene.add(box);
                boxes[jointName] = box;
              }

              // Copy joint transform directly
              boxes[jointName].position.setFromMatrixPosition(joint.matrixWorld);
              boxes[jointName].visible = true;
            } else if (boxes[jointName]) {
              boxes[jointName].visible = false;
            }
          });
        }
      });

      if (renderer.xr.isPresenting) {
        if (activeJointsCount > 0) {
          log(`STATUS: TRACKING ACTIVE!\nActive Hand Joints: ${activeJointsCount}\nRender Loop: ${frameCount}`);
        } else {
          log(`STATUS: VR Active, but NO joints.\nControllers sleeping? YES\nCheck Quest Settings -> Hand Tracking.`);
        }
      }

      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
