<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swarm Instrument</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; overflow: hidden; color: #eef4ff;
      background: #030612; font: 14px system-ui, sans-serif;
    }
    #ui {
      position: fixed; z-index: 2; top: 14px; left: 14px;
      padding: 13px 15px; max-width: 370px;
      border: 1px solid #ffffff30; border-radius: 12px;
      background: #091326dd; backdrop-filter: blur(10px);
    }
    #title { font-size: 17px; font-weight: 700; margin-bottom: 5px; }
    #help, #status { color: #b9c8e3; font-size: 12px; line-height: 1.5; }
    button { margin-top: 9px; padding: 8px 11px; border-radius: 8px;
      border: 1px solid #49638e; color: white; background: #172a49; cursor: pointer; }
    button:hover { background: #233c64; }
    #status { margin-top: 7px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="ui">
    <div id="title">Swarm Instrument</div>
    <div id="help">
      VR: left hand paints color; right hand stirs the swarm.<br>
      Desktop: hold left mouse button to paint; right button to stir.
    </div>
    <button id="sound">Start procedural beat</button>
    <div id="status">Starting…</div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { VRButton } from "three/addons/webxr/VRButton.js";

    const $ = id => document.getElementById(id);
    const N = 400;
    const SHOW_Z = -7;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030612);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 1.65, 0);
    camera.lookAt(0, 1.65, -1);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType("local-floor");
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer, {
      optionalFeatures: ["hand-tracking", "local-floor"]
    }));

    // Each drone has a home point, a current position, and a small velocity.
    const home = new Float32Array(N * 3);
    const pos = new Float32Array(N * 3);
    const vel = new Float32Array(N * 3);
    const rgb = new Float32Array(N * 3);

    for (let i = 0; i < N; i++) {
      const a = i * 2.399963;
      const r = 0.45 + 2.05 * Math.sqrt((i + 0.5) / N);
      home[i * 3]     = r * Math.cos(a);
      home[i * 3 + 1] = 1.65 + 0.78 * r * Math.sin(a);
      home[i * 3 + 2] = SHOW_Z + Math.sin(a * 2) * 0.12;
      pos.set(home.subarray(i * 3, i * 3 + 3), i * 3);
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    geometry.setAttribute("color", new THREE.BufferAttribute(rgb, 3));

    const pointMaterial = new THREE.PointsMaterial({
      size: 0.13, vertexColors: true, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const swarm = new THREE.Points(geometry, pointMaterial);
    scene.add(swarm);

    // Hand cursors show the two control fields in space.
    function makeCursor(color) {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.10, 16, 12),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9 })
      );
      mesh.visible = false;
      scene.add(mesh);
      return mesh;
    }
    const lightCursor = makeCursor(0x55eaff);
    const motionCursor = makeCursor(0xffa64d);

    const light = { p: new THREE.Vector3(), prev: new THREE.Vector3(), v: new THREE.Vector3(), active: false };
    const motion = { p: new THREE.Vector3(), prev: new THREE.Vector3(), v: new THREE.Vector3(), active: false };

    // Desktop fallback: left-drag paints; right-drag stirs.
    const raycaster = new THREE.Raycaster();
    const mouseNdc = new THREE.Vector2();
    const showPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -SHOW_Z);
    let mouseRole = null;
    const mousePoint = new THREE.Vector3();

    renderer.domElement.addEventListener("contextmenu", e => e.preventDefault());
    renderer.domElement.addEventListener("pointerdown", e => {
      if (e.button === 0) mouseRole = "light";
      if (e.button === 2) mouseRole = "motion";
      renderer.domElement.setPointerCapture(e.pointerId);
      updateMouse(e);
    });
    renderer.domElement.addEventListener("pointermove", e => {
      if (mouseRole) updateMouse(e);
    });
    renderer.domElement.addEventListener("pointerup", () => {
      mouseRole = null;
      light.active = false;
      motion.active = false;
    });

    function updateMouse(e) {
      const r = renderer.domElement.getBoundingClientRect();
      mouseNdc.set(
        ((e.clientX - r.left) / r.width) * 2 - 1,
        -((e.clientY - r.top) / r.height) * 2 + 1
      );
      raycaster.setFromCamera(mouseNdc, camera);
      if (!raycaster.ray.intersectPlane(showPlane, mousePoint)) return;
      const brush = mouseRole === "light" ? light : motion;
      brush.prev.copy(brush.p);
      brush.p.copy(mousePoint);
      brush.active = true;
    }

    // Read the tracked index-finger tip and project it onto the show plane.
    const hands = [renderer.xr.getHand(0), renderer.xr.getHand(1)];
    for (const hand of hands) {
      scene.add(hand);
      hand.addEventListener("connected", e => {
        hand.userData.side = e.data?.handedness || "";
      });
    }

    const tipPosition = new THREE.Vector3();
    const cameraPosition = new THREE.Vector3();
    const direction = new THREE.Vector3();
    const projected = new THREE.Vector3();

    function getTip(hand) {
      const joints = hand.joints;
      if (joints?.get) return joints.get("index-finger-tip");
      return joints?.["index-finger-tip"] || hand.getObjectByName("index-finger-tip");
    }

    function projectTipToShow(tip) {
      tip.getWorldPosition(tipPosition);
      camera.getWorldPosition(cameraPosition);
      direction.copy(tipPosition).sub(cameraPosition).normalize();
      if (direction.z > -0.05) return null;
      const distance = (SHOW_Z - cameraPosition.z) / direction.z;
      if (distance < 0) return null;
      return projected.copy(cameraPosition).addScaledVector(direction, distance);
    }

    function updateTrackedHands(dt) {
      light.active = false;
      motion.active = false;

      for (let i = 0; i < hands.length; i++) {
        const hand = hands[i];
        const tip = getTip(hand);
        if (!tip) continue;

        const p = projectTipToShow(tip);
        if (!p) continue;

        // Prefer handedness reported by the device; fall back to hand index.
        const side = hand.userData.side || (i === 0 ? "left" : "right");
        const brush = side === "left" ? light : motion;

        brush.prev.copy(brush.p);
        brush.p.copy(p);
        brush.active = true;
      }

      for (const brush of [light, motion]) {
        if (brush.active && dt > 0) {
          brush.v.copy(brush.p).sub(brush.prev).multiplyScalar(1 / dt);
          brush.v.clampLength(0, 7);
        } else {
          brush.v.multiplyScalar(0.75);
        }
      }

      lightCursor.visible = light.active;
      motionCursor.visible = motion.active;
      if (light.active) lightCursor.position.copy(light.p);
      if (motion.active) motionCursor.position.copy(motion.p);
    }

    // Simple procedural accompaniment, scheduled against the audio clock.
    let audio = null, nextBeat = 0, audioEpoch = 0, beatCount = 0;
    const BPM = 92, BEAT = 60 / BPM;

    function note(freq, when, duration, volume, type = "sine") {
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, when);
      gain.gain.setValueAtTime(0.0001, when);
      gain.gain.exponentialRampToValueAtTime(volume, when + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, when + duration);
      osc.connect(gain).connect(audio.destination);
      osc.start(when);
      osc.stop(when + duration + 0.03);
    }

    $("sound").onclick = async () => {
      if (audio) {
        await audio.close();
        audio = null;
        $("sound").textContent = "Start procedural beat";
        return;
      }
      audio = new AudioContext();
      await audio.resume();
      nextBeat = audio.currentTime + 0.08;
      audioEpoch = nextBeat;
      beatCount = 0;
      $("sound").textContent = "Stop beat";
    };

    function scheduleAudio() {
      if (!audio || audio.state !== "running") return;
      while (nextBeat < audio.currentTime + 0.12) {
        const scale = [110, 130.81, 146.83, 164.81];
        note(scale[beatCount % scale.length], nextBeat, 0.32, 0.055, "triangle");
        if (beatCount % 4 === 0) {
          note(220, nextBeat, 1.25, 0.018, "sine");
          note(329.63, nextBeat, 1.25, 0.012, "sine");
        }
        beatCount++;
        nextBeat += BEAT;
      }
    }

    let lastTime = performance.now();
    const color = new THREE.Color();

    function animate(now) {
      const dt = Math.min(0.04, Math.max(0.001, (now - lastTime) / 1000));
      lastTime = now;

      updateTrackedHands(dt);
      scheduleAudio();

      const hue = light.active
        ? THREE.MathUtils.euclideanModulo((light.p.x + 3) / 6, 1)
        : 0.52;
      const brightness = light.active
        ? THREE.MathUtils.clamp(0.30 + (light.p.y - 0.5) * 0.12, 0.25, 0.62)
        : 0.38;

      let pulse = 0;
      if (audio && audio.state === "running") {
        const phase = ((audio.currentTime - audioEpoch) % BEAT) / BEAT;
        pulse = 0.5 + 0.5 * Math.cos(phase * Math.PI * 2);
      }

      for (let i = 0; i < N; i++) {
        const k = i * 3;
        const x = pos[k], y = pos[k + 1];
        let ax = (home[k] - x) * 1.5 - vel[k] * 1.0;
        let ay = (home[k + 1] - y) * 1.5 - vel[k + 1] * 1.0;

        if (motion.active) {
          const dx = x - motion.p.x, dy = y - motion.p.y;
          const d2 = dx * dx + dy * dy;
          const influence = Math.exp(-d2 / 1.25);
          // Hand motion creates a flowing push, with a small swirl around the brush.
          ax += (motion.v.x * 5 - dy * 0.9) * influence;
          ay += (motion.v.y * 5 + dx * 0.9) * influence;
        }

        vel[k] += ax * dt;
        vel[k + 1] += ay * dt;
        vel[k] *= 0.985;
        vel[k + 1] *= 0.985;
        pos[k] += vel[k] * dt;
        pos[k + 1] += vel[k + 1] * dt;

        const dxL = x - light.p.x, dyL = y - light.p.y;
        const localGlow = light.active ? 0.12 * Math.exp(-(dxL*dxL + dyL*dyL) / 0.7) : 0;
        color.setHSL(
          THREE.MathUtils.euclideanModulo(hue + (i / N) * 0.10, 1),
          0.95,
          Math.min(0.75, brightness + pulse * 0.12 + localGlow)
        );
        rgb[k] = color.r;
        rgb[k + 1] = color.g;
        rgb[k + 2] = color.b;
      }

      geometry.attributes.position.needsUpdate = true;
      geometry.attributes.color.needsUpdate = true;
      renderer.render(scene, camera);

      const inXR = renderer.xr.isPresenting;
      $("status").textContent = inXR
        ? "In headset · left hand: light · right hand: liquid motion"
        : "Mouse test: left-drag paints · right-drag stirs · enter VR for hands";
    }

    renderer.setAnimationLoop(animate);

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
